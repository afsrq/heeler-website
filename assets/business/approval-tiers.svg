<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img"><title>Illustrative management dashboard showing Supervised, Standard and Trusted approval tiers</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="740" rx="20" fill="#1c211d"/><rect x="0" y="0" width="1000" height="65" rx="0" fill="#a5bcec"/><text x="28" y="42" font-size="24" fill="#182b37" font-weight="700"><tspan font-family="Manrope, sans-serif" font-weight="800" letter-spacing="-1.2">heeler</tspan>  /  Business workspace</text><text x="735" y="40" font-size="14" fill="#182b37" font-weight="700">ILLUSTRATIVE UI</text><text x="35" y="116" font-size="32" fill="#eaf0e6" font-weight="700">A clear level of responsibility.</text><text x="35" y="151" font-size="18" fill="#aebda8" font-weight="400">Company approval policy · Example organization</text><rect x="30" y="185" width="940" height="115" rx="12" fill="#303a30"/><rect x="50" y="207" width="7" height="70" rx="3" fill="#bed7ff"/><text x="78" y="227" font-size="25" fill="#bed7ff" font-weight="700">Supervised</text><text x="78" y="262" font-size="20" fill="#eaf0e6" font-weight="400">Manager review, except allowed actions.</text><text x="535" y="251" font-size="17" fill="#d5dece" font-weight="400">For employees who need review at every step.</text><rect x="30" y="320" width="940" height="115" rx="12" fill="#303a30"/><rect x="50" y="342" width="7" height="70" rx="3" fill="#d9efb1"/><text x="78" y="362" font-size="25" fill="#d9efb1" font-weight="700">Standard</text><text x="78" y="397" font-size="20" fill="#eaf0e6" font-weight="400">Follows your company’s lists.</text><text x="535" y="386" font-size="17" fill="#d5dece" font-weight="400">Allowed · Refused · Needs sign-off</text><rect x="30" y="455" width="940" height="115" rx="12" fill="#303a30"/><rect x="50" y="477" width="7" height="70" rx="3" fill="#e6d1f8"/><text x="78" y="497" font-size="25" fill="#e6d1f8" font-weight="700">Trusted</text><text x="78" y="532" font-size="20" fill="#eaf0e6" font-weight="400">Can approve work within company policy.</text><text x="535" y="521" font-size="17" fill="#d5dece" font-weight="400">Send to manager when something feels risky.</text><rect x="30" y="602" width="940" height="100" rx="12" fill="#263e32"/><text x="53" y="638" font-size="22" fill="#d9efb1" font-weight="700">Manager sets the tier. The team knows where it stands.</text><text x="53" y="674" font-size="18" fill="#eaf0e6" font-weight="400">Plain-language planning and approval authority serve different purposes.</text></g></svg>