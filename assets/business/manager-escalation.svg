<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img"><title>Illustrative Trusted employee sending a risky approval decision to a manager</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="740" rx="20" fill="#1c211d"/><rect x="0" y="0" width="1000" height="65" rx="0" fill="#a5bcec"/><text x="28" y="42" font-size="24" fill="#182b37" font-weight="700"><tspan font-family="Manrope, sans-serif" font-weight="800" letter-spacing="-1.2">heeler</tspan>  /  Business workspace</text><text x="735" y="40" font-size="14" fill="#182b37" font-weight="700">ILLUSTRATIVE UI</text><text x="35" y="114" font-size="29" fill="#eaf0e6" font-weight="700">Customer portal / Import update</text><rect x="770" y="85" width="195" height="44" rx="12" fill="#e6d1f8"/><text x="790" y="114" font-size="18" fill="#30233c" font-weight="700">TRUSTED</text><text x="35" y="157" font-size="18" fill="#b8c6b1" font-weight="400">Explain first · Review the plan before proceeding</text><rect x="30" y="185" width="940" height="200" rx="12" fill="#303a30"/><text x="55" y="225" font-size="22" fill="#d9efb1" font-weight="700">Agent’s plan</text><text x="55" y="266" font-size="20" fill="#eaf0e6" font-weight="400">I’ll change how imported customer records match existing accounts.</text><text x="55" y="304" font-size="20" fill="#eaf0e6" font-weight="400">This could change which records are updated. I’ll explain the matching</text><text x="55" y="337" font-size="20" fill="#eaf0e6" font-weight="400">rules and proposed checks before continuing.</text><text x="35" y="427" font-size="23" fill="#eaf0e6" font-weight="700">You can approve this. You can also ask for help.</text><rect x="30" y="454" width="940" height="92" rx="12" fill="#152e44"/><text x="53" y="491" font-size="21" fill="#eaf0e6" font-weight="400">“I’m unsure how this affects our customer records.</text><text x="53" y="522" font-size="21" fill="#eaf0e6" font-weight="400">Please review this decision before we proceed.”</text><rect x="30" y="574" width="190" height="54" rx="12" fill="#354333"/><text x="55" y="608" font-size="19" fill="#eaf0e6" font-weight="400">Approve myself</text><rect x="238" y="574" width="235" height="54" rx="12" fill="#d9efb1"/><text x="260" y="608" font-size="20" fill="#203722" font-weight="700">Send to manager</text><text x="35" y="684" font-size="20" fill="#b8c6b1" font-weight="400">Example escalation: a second set of eyes, without guessing.</text></g></svg>